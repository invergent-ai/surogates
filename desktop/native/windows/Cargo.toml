# Surogate Desktop's native programs on Windows: the Surogate VM service (service/, surogate-service.exe), the
# only part of the app that runs as LocalSystem and the only one that calls the Host Compute Service; the user's
# side of one VM (vm/, surogate-vm.exe); the HCS document and calls (hcs/); and the service's pipe protocol
# (pipe/). Each crate's pure parts build and test on any OS; what calls Windows builds on Windows alone.
[workspace]
resolver = "2"
members = ["hcs"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

# Every crate pinned by Cargo.lock, built with --locked; none from git.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows-sys = "=0.61.2"
hcs = { path = "hcs" }

[profile.release]
# A panic ends the process: the service's VMs end with its handles, as when it is killed.
panic = "abort"
