# Surogate Desktop's native programs on Windows: the Surogate VM service (service/, surogate-service.exe), the
# only part of the app that runs as LocalSystem and the only one that calls the Host Compute Service; the user's
# side of one VM (vm/, surogate-vm.exe); the HCS document and calls (hcs/); the service's pipe protocol (pipe/);
# the app's own helper for what only Windows's libraries answer (helper/, surogate-helper.exe); the program that
# installs an update an administrator approved (admin/, surogate-admin.exe); who owns a file of the install (owners/);
# and the MSI's own custom action (msi/, surogate_msi.dll), which the app does not install. Each crate's
# pure parts build and test on any OS; what calls Windows builds on Windows alone.
[workspace]
resolver = "2"
members = ["hcs", "pipe", "service", "vm", "helper", "msi", "owners", "admin"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

# Every crate pinned by Cargo.lock, built with --locked; none from git.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows-sys = "=0.61.2"
hcs = { path = "hcs" }
pipe = { path = "pipe" }
owners = { path = "owners" }
# Ed25519 alone, pure Rust and with no dependency of its own: surogate-admin.exe checks a release manifest's signature.
ed25519-compact = { version = "=2.6.0", default-features = false, features = ["std"] }

[profile.release]
# A panic ends the process: the service's VMs end with its handles, as when it is killed.
panic = "abort"
