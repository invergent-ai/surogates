[package]
name = "vm"
description = "surogate-vm.exe: the user's side of one VM, between the app's VM manager, the Surogate VM service and the guest's Hyper-V sockets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "surogate-vm"
path = "src/main.rs"

[dependencies]
hcs.workspace = true
pipe.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Vhd", "Win32_System_IO",
  "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading",
] }
