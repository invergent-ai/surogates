# surogate-admin.exe: what installs an update of the app once an administrator approved it through UAC, the one part
# of the app that runs elevated at the user's asking. It checks the release again, from copies of its own where only
# administrators reach, and runs Windows Installer on them; surogate-helper.exe's `update` starts it. And it removes the
# app, by Windows Installer's uninstall, as its `remove` asks.
[package]
name = "surogate-admin"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[lib]
name = "surogate_admin"
path = "src/lib.rs"

[[bin]]
name = "surogate-admin"
path = "src/main.rs"

[dependencies]
ed25519-compact.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
owners.workspace = true
surogate-helper = { path = "../helper" }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
