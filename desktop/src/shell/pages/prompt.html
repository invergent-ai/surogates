<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <title>Surogate</title>
    <link rel="stylesheet" href="shell.css" />
    <script type="module" src="prompt.js"></script>
  </head>
  <body class="prompt-page">
    <div class="prompt" role="alertdialog" aria-modal="true" aria-labelledby="prompt-title" aria-describedby="prompt-lead">
      <h1 id="prompt-title"></h1>
      <p id="prompt-lead" class="desc"></p>
      <div class="prompt-body">
        <div id="prompt-details"></div>
        <fieldset id="prompt-choice" hidden>
          <legend id="prompt-legend"></legend>
        </fieldset>
        <div id="prompt-notes"></div>
      </div>
      <p id="prompt-waiting" class="desc" aria-live="polite"></p>
      <div class="actions" id="prompt-buttons"></div>
    </div>
  </body>
</html>
