# Surogate profile: skills-index lines (SKILL.md files are unchanged and every
# skill stays loadable by name). Short "use when" lines; the platform's long
# trigger descriptions made the index ~1.2k tokens and pulled in skills for
# work that did not need them.
brainstorming:
  description: Agree the design of a large, open-ended build with the user before building it.
dispatching-parallel-agents:
  description: Split 2+ independent investigations or tasks across sub-agents (delegate_task) and merge the results.
executing-plans:
  description: Carry out an existing written implementation plan step by step with checkpoints.
writing-plans:
  description: Turn an agreed spec for a large multi-step build into a step-by-step implementation plan.
writing-skills:
  description: Create or edit a skill (SKILL.md) when the user asks for one.
consolidate-memory:
  description: Clean up memory (merge duplicates, fix or remove stale entries) when the user asks.
doc-coauthoring:
  description: Co-write a long structured document (proposal, spec, decision doc) with the user over several rounds, when they want to collaborate on it.
docx:
  description: Create, edit or convert Word documents (.docx/.dotx), including tracked changes, comments, images and formatting.
import-memory:
  description: Import a memory export from another assistant (ChatGPT, Gemini, Claude, ...) into memory.
maps:
  description: Geocoding, places, routes and timezones via OpenStreetMap/OSRM.
pdf:
  description: Create PDFs, or merge, split, watermark, encrypt/decrypt, extract tables/images from, or OCR existing ones.
pdf-forms:
  description: Fill PDF forms, annotate or redact a PDF, or add, remove or rotate pages.
pdf-reading:
  description: Read a PDF when read_file fails or returns garbled text, or for figures, layout, images, attachments or form-field values.
pptx:
  description: Create, edit or read PowerPoint decks (.pptx/.potx), from scratch or from a template.
schedule:
  description: Create, change, pause or cancel a prompt that runs on a schedule ("every weekday at 8:30", "remind me at noon").
xlsx:
  description: Create or edit spreadsheets (.xlsx/.xlsm/.csv) with formulas, formatting and charts, or clean messy tabular data into one.
