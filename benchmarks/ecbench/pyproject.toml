[project]
name = "ecbench"
version = "0.1.0"
description = "Local E-Commerce Bench (ECBench) experiment for the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    # <1: respx 0.23 still targets the 0.x transport API, and uv is
    # otherwise happy to resolve the 1.0 dev pre-release.
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    # Only for the offline settle-from-pickle path: the pickled env
    # holds upstream objects that reference pandas/numpy on load.
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
ecbench = "ecbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
