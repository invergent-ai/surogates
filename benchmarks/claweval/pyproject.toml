[project]
name = "claweval-bench"
version = "0.1.0"
description = "Claw-Eval benchmark driven through the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "mcp>=1.2,<2",  # adapter uses the 1.x low-level Server decorator API
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
claweval-bench = "claweval_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claweval_bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
