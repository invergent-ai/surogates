[project]
name = "eogbench"
version = "0.1.0"
description = "Local EnterpriseOps-Gym experiment for the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    # <1: respx 0.23 still targets the 0.x transport API, and uv is
    # otherwise happy to resolve the 1.0 dev pre-release.
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    # The vendored gym client uses requests for the database lifecycle.
    "requests>=2.31",
    # Imported (not exercised) by the vendored verifier module: its
    # response_check verifier type is LLM-based, but every public task
    # verifies via pure-SQL database_state. Needed only so the module
    # imports.
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
eogbench = "eogbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eogbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
