[project]
name = "awbench"
version = "0.1.0"
description = "Local AppWorld experiment for the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    # <1: respx 0.23 still targets the 0.x transport API, and uv is
    # otherwise happy to resolve the 1.0 dev pre-release.
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    # The environment, task store and official evaluator. Version is the
    # benchmark's PIN -- graders at another version score differently.
    "appworld==0.1.3.post1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
awbench = "awbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
