[project]
name = "wsbench"
version = "0.1.0"
description = "Local Workspace-Bench-Lite benchmark for the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "huggingface-hub>=0.28",
    # Judge-side text extraction for the office formats tasks emit.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
wsbench = "wsbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
