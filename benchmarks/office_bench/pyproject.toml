[project]
name = "obench"
version = "0.1.0"
description = "Office-document benchmark for the Surogate agent harness: create and edit Word, spreadsheet, deck and PDF files live"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    # Checks read the documents the agent saved.
    "python-docx>=1.2",  # 1.2 adds comments, which docx-many-threads derives its input with
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
obench = "obench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
