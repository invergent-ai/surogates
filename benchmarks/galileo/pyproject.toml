[project]
name = "galbench"
version = "0.1.0"
description = "Local Galileo Agent Leaderboard v2 experiment for the Surogate agent harness"
requires-python = ">=3.12"
dependencies = [
    # <1: respx 0.23 still targets the 0.x transport API, and uv is
    # otherwise happy to resolve the 1.0 dev pre-release.
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
    "huggingface-hub>=0.28",
    # The dataset ships as parquet.
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
galbench = "galbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["galbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
