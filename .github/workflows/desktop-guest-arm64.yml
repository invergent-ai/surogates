# Surogate Desktop's arm64 guest (images/guest/), the macOS app's, built and tested on an arm64 runner,
# natively. Started by hand, on the ref it is given: the release builds arm64's guest only where it
# publishes the macOS app (release.yml's desktop-vm-image-arm64), and here it is built and booted on any
# ref and published nowhere. A run builds and boots whatever code the ref names, so no job here is given
# anything to leak: no secret, no Environment, and a token that reads the repository alone.
name: Desktop's arm64 guest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit whose arm64 guest to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  guest:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    # A cold build of the guest, and the VM suite. This bounds the job once a runner has taken it, and
    # not before: a job no runner takes, as under a label no runner answers, waits queued, where no
    # timeout-minutes counts, until GitHub drops it after a day. Cancel such a run by hand.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        working-directory: desktop
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # Its kernel pin, its key, the kernel's checks and its Image, on an arm64 runner's own tools.
      - name: Run the guest image's tests
        working-directory: desktop
        run: npx vitest run test/guest-image.test.ts

      # The guest stage adds LibreOffice, the Python data stack and Node, and the disk is made inside
      # the build: reclaim the toolchains the runner never uses. Not the tool cache, which holds this
      # job's Node.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # Its tools stage, its kernel and the rule, compiled and checked against the arm64 kernel's BTF;
      # unpacked beside the downloads, for the VM suite.
      - name: Build the image
        run: images/guest/build.sh --arch arm64 images/guest/out

      # The packed image and its manifest kept a week with the run, for a Mac's first boot of the
      # guest by hand: no release publishes the arm64 image yet.
      - name: Keep the image for a Mac
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-guest-arm64
          path: |
            images/guest/out/*.zst
            images/guest/out/manifest.json
          retention-days: 7
          if-no-files-found: error

      # Blacksmith's runners are VMs, and one may have no KVM: the VM suite then boots nothing, and the
      # run says so.
      - name: Look for KVM
        id: kvm
        run: |
          if [ -c /dev/kvm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No KVM::This runner has no /dev/kvm, so the VM suite did not boot the arm64 guest: run it on an arm64 computer with KVM"
          fi

      # As the install script installs them for the Linux app, with QEMU's arm64 machine.
      - name: Install what the VM runs on
        if: steps.kvm.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm virtiofsd uidmap fakeroot bubblewrap zstd
          # The runner's user is in no kvm group: the device is opened to it, on this runner alone.
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # With KVM, never emulated: no SUROGATE_VM_KVM. The agent disk and the file helper are made from
      # dist/, and the VM's sockets go in a runtime folder of the run's own, 0700 and with a short path.
      - name: Run the VM suite against the arm64 image
        if: steps.kvm.outputs.present == 'true'
        working-directory: desktop
        env:
          SUROGATE_VM_TESTS: "1"
          SUROGATE_VM_IMAGE: ${{ github.workspace }}/images/guest/out
        run: |
          npx tsc -p tsconfig.build.json
          XDG_RUNTIME_DIR="$(mktemp -d)" npx vitest run test/vm/
