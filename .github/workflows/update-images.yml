name: Update agent images

on:
  # The Release workflow's rollout job calls it once the cloud's release is out. It is not
  # started by how a Release run ended: that run holds the desktop's jobs too.
  workflow_call:
    # A called workflow reads only the secrets it declares here and its caller hands it. None is
    # marked required: a secret the organisation lacks comes empty, as on a manual run.
    secrets:
      NODE_HOSTS:
        description: The cluster's nodes, separated by spaces.
      MASTER_HOST:
        description: The node the agent pods are restarted from.
      SSH_KEY:
        description: The private key root accepts over SSH on each of them.
  workflow_dispatch:

jobs:
  update-agent-images:
    name: Update agent images on cluster nodes
    # No condition of its own: called by the release it sees the tag's push as its event, and a
    # condition on the event would skip it there without a word.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      REMOTE_SCRIPT: /root/update-agent-images.sh
      NODE_HOSTS: ${{ secrets.NODE_HOSTS }}
      MASTER_HOST: ${{ secrets.MASTER_HOST }}
    steps:
      # These hosts must accept SSH on 22022 from GitHub's egress ranges
      # (see https://api.github.com/meta -> .actions). Check first so a
      # firewall/allow-list gap fails in seconds with a clear message
      # instead of hanging the deploy on TCP timeouts.
      - name: Verify cluster SSH reachability
        run: |
          read -ra HOSTS <<< "${NODE_HOSTS}"
          unreachable=()
          for host in "${HOSTS[@]}" "${MASTER_HOST}"; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/${host}/22022" 2>/dev/null; then
              echo "==> ${host}:22022 reachable"
            else
              echo "==> ${host}:22022 UNREACHABLE" >&2
              unreachable+=("${host}")
            fi
          done
          if [ "${#unreachable[@]}" -ne 0 ]; then
            echo "::error::No SSH route from this GitHub-hosted runner to: ${unreachable[*]}. Allow-list GitHub's Actions egress ranges on port 22022, or run this workflow on the self-hosted runner."
            exit 1
          fi

      - name: Write SSH identity file
        run: |
          install -m 700 -d "${RUNNER_TEMP}/.ssh"
          printf '%s\n' "${{ secrets.SSH_KEY }}" > "${RUNNER_TEMP}/.ssh/id_node"
          chmod 600 "${RUNNER_TEMP}/.ssh/id_node"

      - name: Update agent images on cluster nodes
        run: |
          IDENTITY_FILE="${RUNNER_TEMP}/.ssh/id_node"

          read -ra HOSTS <<< "${NODE_HOSTS}"

          pids=()
          hosts=()

          for host in "${HOSTS[@]}"; do
            (
              echo "==> Running ${REMOTE_SCRIPT} on ${host}"
              ssh \
                -p 22022 \
                -i "${IDENTITY_FILE}" \
                -o BatchMode=yes \
                -o ConnectTimeout=15 \
                -o StrictHostKeyChecking=accept-new \
                "root@${host}" \
                "bash ${REMOTE_SCRIPT}"
            ) &

            pids+=("$!")
            hosts+=("${host}")
          done

          status=0

          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "==> Completed ${REMOTE_SCRIPT} on ${hosts[$i]}"
            else
              echo "==> Failed ${REMOTE_SCRIPT} on ${hosts[$i]}" >&2
              status=1
            fi
          done

          ssh -p 22022 -i "${IDENTITY_FILE}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "root@${MASTER_HOST}" "bash /root/restart-agent-pods.sh"

          exit "${status}"

      - name: Remove SSH identity file
        if: always()
        run: rm -f "${RUNNER_TEMP}/.ssh/id_node"
