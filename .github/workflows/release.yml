name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  wheel:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # It uploads an artifact, never a release asset: the release's assets anchor the desktop's image.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      # The version comes from the tag being released, NOT from
      # setuptools-scm's `git describe`. Describe is unreliable here for two
      # compounding reasons, and v2.13.3 shipped a wheel named 2.13.2 because
      # of them:
      #
      #   1. Several tags can sit on one commit (v2.9.3, v2.13.2 and v2.13.3
      #      all point at 8d949552), so describe has more than one exact match
      #      to choose between.
      #   2. actions/checkout fetches the pushed tag as a LIGHTWEIGHT ref,
      #      dropping the annotation, so describe can prefer a different
      #      annotated tag on the same commit over the one being released.
      #
      # Pinning it removes the guesswork: a release tagged vX.Y.Z produces a
      # wheel named X.Y.Z, whatever the tag topology looks like. The images
      # job already derives its tag from GITHUB_REF_NAME the same way, which
      # is why the container tags were right while the wheel names were not.
      - name: Resolve version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.value }}
        run: uv build

      # A wheel whose name disagrees with its tag is worse than a failed
      # release: the download URL in every consumer's pin is built from the
      # tag, so it 404s, and anyone who "fixes" the URL by hand pins a version
      # string that does not match what they think they are installing.
      # Fail here instead, while it is still cheap to re-cut.
      - name: Verify the artifacts match the tag
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.value }}"
          for ext in "py3-none-any.whl" "tar.gz"; do
            if [ ! -f "dist/surogates-${expected}-${ext}" ] \
               && [ ! -f "dist/surogates-${expected}.${ext}" ]; then
              echo "::error::expected an artifact for version ${expected}, got:"
              ls -1 dist/
              exit 1
            fi
          done
          ls -1 dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*

  images:
    needs: npm
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # GHCR's, and no release asset.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: api
            name: surogates-api
          - dir: worker
            name: surogates-worker
          - dir: sandbox
            name: surogates-agent-sandbox
          - dir: s3fs
            name: surogates-s3fs
          - dir: browser
            name: surogates-agent-browser
          - dir: ssh-agent
            name: surogates-ssh-agent
          - dir: voice
            name: surogates-voice
          - dir: office
            name: surogates-office
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GitHub-hosted runners start with ~14 GB free; the api and sandbox
      # images add LibreOffice + Tesseract on top of the Python deps.
      # Reclaim the preinstalled toolchains we never use (~25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache/CodeQL}"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/invergent-ai/${{ matrix.name }}:${{ steps.version.outputs.value }}
            ghcr.io/invergent-ai/${{ matrix.name }}:latest
          # The runner is ephemeral, so the layer cache lives in GHCR next to
          # the image (mode=max keeps intermediate stages too). First build
          # after this change is cold; subsequent ones reuse it.
          cache-from: type=registry,ref=ghcr.io/invergent-ai/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/invergent-ai/${{ matrix.name }}:buildcache,mode=max

  npm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      # Left off deliberately. Now that this job runs on a github-hosted
      # runner, npm provenance (and OIDC trusted publishing) would be
      # accepted — but that needs a trusted publisher configured on the
      # npmjs side first, so enabling it here would break publishing.
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@invergent"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter './sdk/*' --if-present run build

      - name: Publish SDK packages
        env:
          # Long-lived npm automation token. Switchable to OIDC trusted
          # publishing now that the runner is github-hosted (see the
          # NPM_CONFIG_PROVENANCE note above).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-sdk-packages.mjs --version="${GITHUB_REF_NAME#v}"

  # Surogate Desktop's VM guest (images/guest/), published on R2 under desktop/vm/<key>/
  # only when its inputs changed: images/guest/inputs.sh names the key, which carries the arch.
  # R2 is never the truth: each release that ships a key attaches its manifest to itself
  # (desktop-vm-manifest, below), and later releases take it from there and check R2's
  # files against it. The manifest is kept for the desktop's tarball, published or found.
  # The cloud's release does not wait for it; the desktop's does. amd64's image, the Linux app's:
  # arm64's, the macOS app's, has a job of its own (desktop-vm-image-arm64), as a job that waited for
  # both would hold the Linux app's release on an arm64 runner.
  desktop-vm-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Past a cold build of the guest, and past fetch's wait of up to 15 minutes for a key's manifest.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      state: ${{ steps.published.outputs.state }}
    # One build of a key at a time: a second release's finds it published. A third release
    # pushed meanwhile cancels the second's run while it waits, as GitHub's groups do.
    concurrency:
      group: desktop-vm-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The guest kernel is the only boundary between two chats' commands: a desktop
      # release does not ship while noble-security has a newer one than the pin.
      - name: Check the guest's kernel pin is current
        run: images/guest/kernel-current.sh --arch amd64

      - name: Look for the image's key in our releases, and check R2 against it
        id: published
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(images/guest/publish.sh --arch amd64 fetch images/guest/out)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      # The guest stage adds LibreOffice, the Python data stack and Node, and the disk
      # is made inside the build: reclaim the toolchains the runner never uses.
      - name: Free disk space
        if: steps.published.outputs.state == 'missing'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache/CodeQL}"
          df -h /

      - name: Build the image
        if: steps.published.outputs.state == 'missing'
        run: images/guest/build.sh --arch amd64 --packed images/guest/out

      - name: Publish the image
        if: steps.published.outputs.state == 'missing'
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: images/guest/publish.sh --arch amd64 send images/guest/out

      - name: Keep the image's manifest for the desktop's tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-vm-manifest
          path: images/guest/out/manifest.json
          if-no-files-found: error

  # The manifest of the image this release ships, attached to the release as
  # desktop-vm-<key>.json once the release exists, whether this release published the key or
  # checked R2 against an earlier release's copy: the next releases' desktop-vm-image takes it
  # from any of them, never from R2, so deleting one release strands no key.
  desktop-vm-manifest:
    needs:
      - release
      - desktop-vm-image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-vm-manifest
          path: out

      - name: Attach the image's manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(jq -r .key out/manifest.json)"
          cp out/manifest.json "desktop-vm-${key}.json"
          # A re-run finds it attached already: desktop-vm-image's fetch then took these bytes from here.
          attached="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq "any(.assets[]; .name == \"desktop-vm-${key}.json\")")"
          if [ "$attached" != true ]; then
            gh release upload "$GITHUB_REF_NAME" "desktop-vm-${key}.json" --repo "$GITHUB_REPOSITORY"
          fi

  # arm64's guest image, the macOS app's, as amd64's is, on an arm64 runner, in a concurrency group of its own, and its
  # manifest attached to the release by a job of its own: only where the run publishes the macOS app (desktop-signing-mode),
  # so that an arm64 runner that fails, or that never comes, holds nothing of Linux's.
  desktop-vm-image-arm64:
    needs: desktop-signing-mode
    if: needs.desktop-signing-mode.outputs.mac-signing == 'developer-id'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      state: ${{ steps.published.outputs.state }}
    concurrency:
      group: desktop-vm-image-arm64
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the guest's kernel pin is current
        run: images/guest/kernel-current.sh --arch arm64

      - name: Look for the image's key in our releases, and check R2 against it
        id: published
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(images/guest/publish.sh --arch arm64 fetch images/guest/out)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.published.outputs.state == 'missing'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache/CodeQL}"
          df -h /

      - name: Build the image
        if: steps.published.outputs.state == 'missing'
        run: images/guest/build.sh --arch arm64 --packed images/guest/out

      - name: Publish the image
        if: steps.published.outputs.state == 'missing'
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: images/guest/publish.sh --arch arm64 send images/guest/out

      - name: Keep the image's manifest for the macOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-vm-manifest-arm64
          path: images/guest/out/manifest.json
          if-no-files-found: error

  desktop-vm-manifest-arm64:
    needs:
      - release
      - desktop-vm-image-arm64
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-vm-manifest-arm64
          path: out

      - name: Attach the image's manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(jq -r .key out/manifest.json)"
          cp out/manifest.json "desktop-vm-${key}.json"
          # A re-run finds it attached already: desktop-vm-image-arm64's fetch then took these bytes from here.
          attached="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq "any(.assets[]; .name == \"desktop-vm-${key}.json\")")"
          if [ "$attached" != true ]; then
            gh release upload "$GITHUB_REF_NAME" "desktop-vm-${key}.json" --repo "$GITHUB_REPOSITORY"
          fi

  # Surogate Desktop's release (desktop/release/), in three jobs, as every step of a job shares its
  # runner: a job is the boundary, and a step is none. desktop-build makes the tarball from this
  # tag with the VM image's manifest the desktop-vm-image job checked R2 against, and holds no
  # secret: its npm ci runs the install scripts of the whole dependency tree. desktop-describe
  # reads that tarball, all of it that is ever read before it is installed, and says one word of
  # it, the app's state schema: it holds no secret either, and runs no npm. desktop-publish runs
  # no npm, no script of a dependency's, and nothing that opens the tarball: in the
  # desktop-release Environment, which only a v* tag deploys to, it writes and signs the
  # release's manifest with the release key, of this tag, the build's own two words for its
  # tarball and that one of the describe job's, each a job's own output, then puts the release,
  # the install script and latest.json on R2 under desktop/. The cloud's release waits for none;
  # the cluster's rollout waits for all.
  # What rests on the describe job's runner alone: that a signed release's root helper is the
  # tag's install script. The job that signs opens no tarball, and cannot see it.
  # Every action of the workflow is named by its commit: a tag can be moved to other code.
  desktop-build:
    needs: desktop-vm-image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    # The tarball's hash and its size, which the publish job signs for and no others: the artifact
    # is the run's, where any job may put another file under its name, and a job's outputs are its own.
    outputs:
      sha256: ${{ steps.tarball.outputs.sha256 }}
      size: ${{ steps.tarball.outputs.size }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build the app
        working-directory: desktop
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          # The app's node and its spelling dictionary are fetched and checked against their pins, never ones a runner kept.
          rm -rf bin dictionaries
          npm ci
          node node_modules/electron/install.js
          npm run build

      - name: Take the VM image's manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-vm-manifest
          path: out/vm

      # The agent's disk holds root's files, and is made by a user who is not root, under fakeroot:
      # in no user namespace, which a stock Ubuntu 24.04 refuses a program without a profile of its own.
      - name: Install fakeroot, which the agent's disk is made with
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fakeroot

      - name: Package the app
        run: desktop/scripts/package.sh "${GITHUB_REF_NAME#v}" out/vm/manifest.json out/desktop

      - name: Say the tarball's hash and size to the publish job
        id: tarball
        run: |
          echo "sha256=$(sha256sum <"out/desktop/surogate-desktop-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "out/desktop/surogate-desktop-${GITHUB_REF_NAME#v}-linux-x64.tar.gz")" >>"$GITHUB_OUTPUT"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-tarball
          path: out/desktop/surogate-desktop-*-linux-x64.tar.gz
          if-no-files-found: error

      # The agent's disk, which package.sh leaves beside the tarball: the Windows app's build lays it out as its own,
      # where no mke2fs makes one.
      - name: Keep the agent disk for the other targets' builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-agent-disk
          path: out/desktop/agent.img
          if-no-files-found: error

  desktop-describe:
    needs: desktop-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    # The app's state schema, the one word of this job's that the publish job signs for: a job's
    # outputs are its own, where an artifact is the run's, and any job may put another file
    # under its name.
    outputs:
      schema: ${{ steps.manifest.outputs.schema }}
    steps:
      # publish.sh, and the install script it reads the tarball's helper and package by, from the
      # tag; the tarball from the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-tarball
          path: out/desktop

      # All that reads the build's tarball, in a job that has no secret and no Environment: what a
      # flaw in a reader of the build's bytes could write, or leave running, stays on this runner.
      # What the build says is read from the step's environment, never pasted into its script.
      # The manifest it writes is this job's own check of the release; the publish job writes its
      # own, and takes from here the state schema alone.
      - name: Write its manifest, and say the app's state schema to the publish job
        id: manifest
        env:
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-build.outputs.sha256 }}
        run: |
          desktop/release/publish.sh describe "${GITHUB_REF_NAME#v}" out/desktop
          echo "schema=$(jq -r .stateSchema out/desktop/manifest.json)" >>"$GITHUB_OUTPUT"

  # Surogate Desktop for Windows (desktop/windows/msi): the layout built on Windows from this tag, its programs signed,
  # the MSI made of the signed layout, and the MSI signed, each a job of its own, as each job's steps share its runner.
  # The two that build run npm's and Cargo's install scripts and WiX, and hold no secret, no Environment and no token to
  # sign with. The two that sign run no npm, node, cargo, dotnet or WiX: in the desktop-windows-signing Environment,
  # which only a v* tag deploys to, they sign with Azure Artifact Signing's own action, through OpenID Connect and no
  # stored secret, where desktop-signing-mode says the account signs; the Environment's
  # variables name the rest (ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_CERTIFICATE_PROFILE, and AZURE_CLIENT_ID and
  # AZURE_TENANT_ID, the federated credential's). Until it does, each signs with a certificate made in its run, issued by
  # a root the runner trusts for that job alone, so that every check of the signatures runs as it will on the release's;
  # what they sign is kept nowhere and published nowhere, and no job of Linux's, nor the cluster's rollout, waits for
  # them: a trial that fails stops nothing of the release. The Environment has no required reviewers, as the release's
  # has none: once signing is real, a reviewer on it would hold every release, Linux's rollout with it.
  # How this release signs the Windows app, decided once for the whole run, when it starts, by the repository's
  # ARTIFACT_SIGNING_ACCOUNT variable: `account`, by Artifact Signing's account that variable names, or `trial`, by a
  # certificate of each signing job's own run; and the signer every program and the MSI must carry, the subject of the
  # account's certificate as the repository's ARTIFACT_SIGNING_SUBJECT variable names it, or the trial's own. Each job
  # that signs, makes the MSI, publishes or rolls out takes these from here and never reads the variables again: a job
  # re-run after the variable changed signs, publishes and rolls out as the run began, with what the run's earlier jobs
  # made. It reads nothing of the repository's and holds nothing.
  # And how it signs the macOS app, by the repository's APPLE_TEAM_ID variable, which says that the Apple Developer
  # account's Developer ID Application certificate and notary key are in the desktop-macos-signing Environment:
  # `developer-id`, by that certificate, which must be that team's, or `trial`, by an identity of the trial job's own run;
  # and the signer each signature must be of, that Team ID or the trial's own name. Every job of macOS's takes these from
  # here too.
  desktop-signing-mode:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    outputs:
      signing: ${{ steps.mode.outputs.signing }}
      account: ${{ steps.mode.outputs.account }}
      signer: ${{ steps.mode.outputs.signer }}
      mac-signing: ${{ steps.mac.outputs.signing }}
      mac-signer: ${{ steps.mac.outputs.signer }}
    steps:
      - name: Decide how the Windows app is signed
        id: mode
        env:
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SUBJECT: ${{ vars.ARTIFACT_SIGNING_SUBJECT }}
        run: |
          if [ -n "$ACCOUNT" ]; then
            printf 'signing=account\naccount=%s\nsigner=%s\n' "$ACCOUNT" "$SUBJECT" >>"$GITHUB_OUTPUT"
          else
            printf 'signing=trial\naccount=\nsigner=CN=Surogate trial signer\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Decide how the macOS app is signed
        id: mac
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$TEAM" ]; then
            printf 'signing=developer-id\nsigner=%s\n' "$TEAM" >>"$GITHUB_OUTPUT"
          else
            printf 'signing=trial\nsigner=Surogate trial signer\n' >>"$GITHUB_OUTPUT"
          fi

  desktop-win-build:
    needs: desktop-build
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      # The repository's files as they are written: git for Windows would check each text file out with CRLF line ends.
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # The scripts are a POSIX shell's: Git for Windows' bash, by its whole path, as no other bash is on the PATH.
      - name: Install Electron
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run electron:install

      - name: Build the app for Windows, with every native part of it
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run build:win32

      - name: Take the VM image's manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-vm-manifest
          path: out/vm

      - name: Take the agent disk
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-agent-disk
          path: out/agent

      - name: Lay out the app
        shell: bash
        run: scripts/package-win.sh "${GITHUB_REF_NAME#v}" ../out/vm/manifest.json ../out/agent/agent.img ../out/win

      - name: Keep the layout for its signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-win-unsigned
          path: out/win
          if-no-files-found: error

  desktop-win-sign:
    needs:
      - desktop-win-build
      - desktop-signing-mode
    runs-on: windows-2025
    timeout-minutes: 30
    environment: desktop-windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Keep the repository's line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-unsigned
          path: out/win

      - name: List the programs to sign
        run: desktop/scripts/sign-win.ps1 list out/win out/programs.txt

      - name: Sign in to Azure
        if: needs.desktop-signing-mode.outputs.signing == 'account'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the programs with Artifact Signing
        if: needs.desktop-signing-mode.outputs.signing == 'account'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ needs.desktop-signing-mode.outputs.account }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-catalog: ${{ github.workspace }}\out\programs.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Sign the programs with this run's certificate
        if: needs.desktop-signing-mode.outputs.signing == 'trial'
        id: trial
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
        run: |
          $root = desktop/scripts/sign-win.ps1 trial out/programs.txt $env:SIGNER
          "root=$root" >> $env:GITHUB_OUTPUT

      # By Windows's own trust, one signature each, by the run's signer alone: the account's under its public root, a
      # trial's under its run's root, which the runner trusts no more once the job ends.
      - name: Check every program's signature
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
          ROOT: ${{ needs.desktop-signing-mode.outputs.signing == 'account' && 'account' || steps.trial.outputs.root }}
        run: desktop/scripts/sign-win.ps1 verify out/win $env:SIGNER $env:ROOT

      - name: Trust this run's root no more
        if: always() && steps.trial.outputs.root != ''
        env:
          TRIAL_ROOT: ${{ steps.trial.outputs.root }}
        run: desktop/scripts/sign-win.ps1 untrust $env:TRIAL_ROOT

      - name: Keep the signed layout for the MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-win-signed
          path: out/win
          if-no-files-found: error

  desktop-win-msi:
    needs:
      - desktop-win-sign
      - desktop-signing-mode
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Keep the repository's line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the signed layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-signed
          path: out/win

      # Each program the run's signer's alone, before WiX makes anything of them: this runner trusts no trial's root, so
      # the signer is read from each signature, which its signing job checked by trust.
      - name: Check that the run's signer signed the layout
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
        run: desktop/scripts/sign-win.ps1 signed-by out/win $env:SIGNER

      - name: Make the MSI
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          desktop/scripts/msi-win.ps1 $version out/win/Surogate out/win/msi "out/msi/surogate-desktop-$version-win32-x64.msi"

      - name: Keep the MSI for its signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-win-msi-unsigned
          path: out/msi/surogate-desktop-*-win32-x64.msi
          if-no-files-found: error

  desktop-win-sign-msi:
    needs:
      - desktop-win-msi
      - desktop-signing-mode
    runs-on: windows-2025
    timeout-minutes: 20
    environment: desktop-windows-signing
    permissions:
      contents: read
      id-token: write
    # The MSI's hash and its size, which the publish job signs for and no others, as desktop-build's for its tarball.
    outputs:
      sha256: ${{ steps.msi.outputs.sha256 }}
      size: ${{ steps.msi.outputs.size }}
    steps:
      - name: Keep the repository's line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-msi-unsigned
          path: out/msi

      - name: Take the signed layout, which the MSI must hold
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-signed
          path: out/win

      - name: List the MSI to sign
        run: desktop/scripts/sign-win.ps1 list out/msi out/msis.txt

      - name: Sign in to Azure
        if: needs.desktop-signing-mode.outputs.signing == 'account'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the MSI with Artifact Signing
        if: needs.desktop-signing-mode.outputs.signing == 'account'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ needs.desktop-signing-mode.outputs.account }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-catalog: ${{ github.workspace }}\out\msis.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Sign the MSI with this run's certificate
        if: needs.desktop-signing-mode.outputs.signing == 'trial'
        id: trial
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
        run: |
          $root = desktop/scripts/sign-win.ps1 trial out/msis.txt $env:SIGNER
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Check the MSI's signature
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
          ROOT: ${{ needs.desktop-signing-mode.outputs.signing == 'account' && 'account' || steps.trial.outputs.root }}
        run: desktop/scripts/sign-win.ps1 verify out/msi $env:SIGNER $env:ROOT

      # What the MSI holds, by Windows's own administrative extract: the signed layout, byte for byte, every program the
      # same signer's as the MSI, and under the account each checked by trust again. An MSI of programs another signed,
      # a trial's within the account's among them, goes no further.
      - name: Check every program the MSI holds
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.signer }}
          ROOT: ${{ needs.desktop-signing-mode.outputs.signing == 'account' && 'account' || steps.trial.outputs.root }}
        run: desktop/scripts/sign-win.ps1 contents "out/msi/surogate-desktop-$($env:GITHUB_REF_NAME -replace '^v', '')-win32-x64.msi" out/win/Surogate $env:SIGNER $env:ROOT

      - name: Trust this run's root no more
        if: always() && steps.trial.outputs.root != ''
        env:
          TRIAL_ROOT: ${{ steps.trial.outputs.root }}
        run: desktop/scripts/sign-win.ps1 untrust $env:TRIAL_ROOT

      - name: Say the MSI's hash and size to the publish job
        id: msi
        run: |
          $msi = Get-Item "out/msi/surogate-desktop-$($env:GITHUB_REF_NAME -replace '^v', '')-win32-x64.msi"
          "sha256=$((Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "size=$($msi.Length)" >> $env:GITHUB_OUTPUT

      # Only an MSI the signing account signed is handed on: a trial's goes nowhere.
      - name: Keep the signed MSI for the publish job
        if: needs.desktop-signing-mode.outputs.signing == 'account'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-win-msi
          path: out/msi/surogate-desktop-*-win32-x64.msi
          if-no-files-found: error

  # The Windows layout the MSI is made of, read as desktop-describe reads the tarball, in a job with no secret: its
  # app's state schema, which must be the Linux app's, and its release keys, install.sh's. Its one word handed on is
  # that schema.
  desktop-win-describe:
    needs:
      - desktop-describe
      - desktop-win-sign-msi
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      schema: ${{ steps.manifest.outputs.schema }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the signed layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-signed
          path: out/win

      - name: Write its manifest, and say the app's state schema to the publish job
        id: manifest
        env:
          DESKTOP_TARGET: win32-x64
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-win-sign-msi.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-win-sign-msi.outputs.size }}
          LINUX_STATE_SCHEMA: ${{ needs.desktop-describe.outputs.schema }}
        run: |
          desktop/release/publish.sh describe "${GITHUB_REF_NAME#v}" out/win
          schema="$(jq -r .stateSchema out/win/manifest.json)"
          [ "$schema" = "$LINUX_STATE_SCHEMA" ] || { echo "::error::The Windows app keeps state of schema $schema, and the Linux app of $LINUX_STATE_SCHEMA"; exit 1; }
          echo "schema=$schema" >>"$GITHUB_OUTPUT"

  desktop-publish:
    needs:
      - desktop-build
      - desktop-describe
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: read
    # One release at a time, so latest.json names the newest of tags pushed close together.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      # publish.sh, and the install script it trusts and sends, from the tag; the tarball from the
      # build. Each action by its commit: a tag can be moved to other code, which this job would
      # run with the release key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-tarball
          path: out/desktop

      # The signing opens no tarball and reads no file of another job's: it writes the manifest of
      # this tag, of the tarball the build made, by the build's own words for its hash and its
      # size, and of the state schema the describe job read, and signs it.
      - name: Sign its manifest
        env:
          DESKTOP_RELEASE_KEY: ${{ secrets.DESKTOP_RELEASE_KEY }}
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-build.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-build.outputs.size }}
          DESKTOP_STATE_SCHEMA: ${{ needs.desktop-describe.outputs.schema }}
        run: desktop/release/publish.sh sign "${GITHUB_REF_NAME#v}" out/desktop

      # The manifest and its signature are sent only as a pair by the install script's keys, and
      # the tarball only as the one that the manifest names, by its hash.
      - name: Publish the release
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: desktop/release/publish.sh send "${GITHUB_REF_NAME#v}" out/desktop

  # Windows's publish, as Linux's, in the same Environment and with the same steps, under Windows's names
  # (release/publish.sh, target_files): the MSI the signing account signed, by its signing job's words for its hash and
  # size, and of the schema the Windows describe read. Only where desktop-signing-mode says the account signs: else it is
  # skipped, and the release publishes no Windows file. Linux's publish never waits for it.
  desktop-win-publish:
    needs:
      - desktop-win-sign-msi
      - desktop-win-describe
      - desktop-signing-mode
    if: needs.desktop-signing-mode.outputs.signing == 'account'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: read
    # One Windows release at a time, so its latest.json names the newest of tags pushed close together.
    concurrency:
      group: desktop-release-win32-x64
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-win-msi
          path: out/desktop

      - name: Sign its manifest
        env:
          DESKTOP_TARGET: win32-x64
          DESKTOP_RELEASE_KEY: ${{ secrets.DESKTOP_RELEASE_KEY }}
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-win-sign-msi.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-win-sign-msi.outputs.size }}
          DESKTOP_STATE_SCHEMA: ${{ needs.desktop-win-describe.outputs.schema }}
        run: desktop/release/publish.sh sign "${GITHUB_REF_NAME#v}" out/desktop

      - name: Publish the release
        env:
          DESKTOP_TARGET: win32-x64
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: desktop/release/publish.sh send "${GITHUB_REF_NAME#v}" out/desktop

  # Surogate Desktop for macOS (scripts/package-mac.sh): Surogate.app built and laid out on a Mac from this tag, with the
  # agent disk desktop-build made and arm64's guest image's manifest; signed, notarized and stapled; packed as the tarball
  # the app updates from, and put in the disk image a person installs it from, which is signed, notarized and stapled
  # too; each a job of its own, as each job's steps share its runner. The build runs npm's install scripts and holds no
  # secret, no Environment and no token to sign with. The signing runs no npm, npx or node: in the desktop-macos-signing
  # Environment, which only a v* tag deploys to, it imports the Developer ID Application certificate
  # (MACOS_SIGNING_CERTIFICATE_P12, MACOS_SIGNING_CERTIFICATE_PASSWORD) into a keychain of its own, gone at its end, and
  # signs with it only where it is the one identity of the Team ID desktop-signing-mode names; it notarizes with the
  # notary service's API key (APPLE_NOTARY_KEY_P8, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID), and has Gatekeeper
  # assess both. The describe reads the tarball with no secret, and the publish signs its manifest and sends it, with the
  # disk image, as Linux's and Windows's do, by the signing job's own words for both. Each runs only where
  # desktop-signing-mode says the Developer ID signs, and so arm64's guest image is built: else each is skipped as soon
  # as its needs have ended, and desktop-mac-trial is macOS's part of the release. The Environment has no required
  # reviewers, as the release's has none.
  desktop-mac-build:
    needs:
      - desktop-build
      - desktop-vm-image-arm64
      - desktop-signing-mode
    if: needs.desktop-signing-mode.outputs.mac-signing == 'developer-id'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          # The app's node, its rg and its spelling dictionary are fetched and checked against their pins, never ones a runner kept.
          rm -rf bin dictionaries
          npm ci

      - name: Build the app for a Mac, with every native program of it
        run: scripts/mac-build.sh

      - name: Take the agent disk
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-agent-disk
          path: out/agent

      - name: Take arm64's guest image's manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-vm-manifest-arm64
          path: out/vm

      - name: Lay out Surogate.app
        run: scripts/package-mac.sh "${GITHUB_REF_NAME#v}" ../out/vm/manifest.json ../out/agent/agent.img ../out/mac

      - name: Check the layout
        env:
          SUROGATE_MAC_LAYOUT: ${{ github.workspace }}/out/mac/Surogate.app
          SUROGATE_MAC_AGENT_DISK: ${{ github.workspace }}/out/agent/agent.img
          SUROGATE_MAC_VM_MANIFEST: ${{ github.workspace }}/out/vm/manifest.json
        run: SUROGATE_MAC_VERSION="${GITHUB_REF_NAME#v}" npx vitest run --project unit --reporter=verbose test/package-mac.test.ts

      # A tarball, which keeps the frameworks' links that an artifact would not.
      - name: Pack the layout for its signing
        run: scripts/sign-mac.sh pack ../out/mac/Surogate.app ../out/desktop-mac-unsigned.tar.gz

      - name: Keep the layout for its signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mac-unsigned
          path: out/desktop-mac-unsigned.tar.gz
          if-no-files-found: error

  desktop-mac-sign:
    needs:
      - desktop-mac-build
      - desktop-signing-mode
    runs-on: macos-15
    # Two submissions to the notary service, each waited for.
    timeout-minutes: 120
    environment: desktop-macos-signing
    permissions:
      contents: read
    # The tarball's hash and its size, and the disk image's hash, which the publish job signs for and sends by, and no
    # others: an artifact is the run's, and a job's outputs are its own.
    outputs:
      sha256: ${{ steps.made.outputs.sha256 }}
      size: ${{ steps.made.outputs.size }}
      dmg-sha256: ${{ steps.made.outputs.dmg-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Take the layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-mac-unsigned
          path: out

      - name: Unpack the layout
        run: mkdir out/mac && tar -xzf out/desktop-mac-unsigned.tar.gz -C out/mac

      # The keychain's path is said before anything is put in it, so that it is gone at the job's end however it ends.
      - name: Import the Developer ID into a keychain of this job's own
        id: identity
        env:
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          TEAM: ${{ needs.desktop-signing-mode.outputs.mac-signer }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "keychain=$keychain" >>"$GITHUB_OUTPUT"
          identity="$(desktop/scripts/sign-mac.sh import "$keychain" "$TEAM")"
          echo "identity=$identity" >>"$GITHUB_OUTPUT"

      - name: Sign the app, inside out
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: desktop/scripts/sign-mac.sh sign out/mac/Surogate.app "$IDENTITY" "$KEYCHAIN"

      - name: Check every program's signature
        env:
          TEAM: ${{ needs.desktop-signing-mode.outputs.mac-signer }}
        run: desktop/scripts/sign-mac.sh verify out/mac/Surogate.app developer-id "$TEAM"

      - name: Notarize the app, and staple its ticket to it
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: desktop/scripts/sign-mac.sh notarize out/mac/Surogate.app

      - name: Pack the app the updates are made of
        run: |
          mkdir out/release
          desktop/scripts/sign-mac.sh pack out/mac/Surogate.app "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz"

      - name: Make the disk image, and sign it
        env:
          IDENTITY: ${{ steps.identity.outputs.identity }}
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: desktop/scripts/sign-mac.sh dmg out/mac/Surogate.app "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg" "$IDENTITY" "$KEYCHAIN"

      - name: Notarize the disk image, and staple its ticket to it
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: desktop/scripts/sign-mac.sh notarize "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg"

      - name: Check the disk image
        env:
          TEAM: ${{ needs.desktop-signing-mode.outputs.mac-signer }}
        run: desktop/scripts/sign-mac.sh dmg-check "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg" out/mac/Surogate.app developer-id "$TEAM"

      # As a Mac that downloaded them assesses them: notarized Developer ID software, its ticket stapled to it.
      - name: Ask Gatekeeper of the app and the disk image
        run: desktop/scripts/sign-mac.sh assess out/mac/Surogate.app "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg"

      - name: Forget the keychain
        if: always() && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: desktop/scripts/sign-mac.sh forget "$KEYCHAIN"

      - name: Say the tarball's hash and size, and the disk image's hash, to the publish job
        id: made
        run: |
          echo "sha256=$(shasum -a 256 <"out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "size=$(stat -f %z "out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz")" >>"$GITHUB_OUTPUT"
          echo "dmg-sha256=$(shasum -a 256 <"out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Keep the tarball for the describe and the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mac-tarball
          path: out/release/surogate-desktop-*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Keep the disk image for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mac-dmg
          path: out/release/surogate-desktop-*-darwin-arm64.dmg
          if-no-files-found: error

  # The tarball, read as desktop-describe reads Linux's, in a job with no secret: Surogate.app its one folder, of files,
  # folders and links that stay inside it, its app's state schema, which must be the Linux app's, and its release keys,
  # install.sh's. Its one word handed on is that schema.
  desktop-mac-describe:
    needs:
      - desktop-describe
      - desktop-mac-sign
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      schema: ${{ steps.manifest.outputs.schema }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-mac-tarball
          path: out/mac

      - name: Write its manifest, and say the app's state schema to the publish job
        id: manifest
        env:
          DESKTOP_TARGET: darwin-arm64
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-mac-sign.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-mac-sign.outputs.size }}
          LINUX_STATE_SCHEMA: ${{ needs.desktop-describe.outputs.schema }}
        run: |
          desktop/release/publish.sh describe "${GITHUB_REF_NAME#v}" out/mac
          schema="$(jq -r .stateSchema out/mac/manifest.json)"
          [ "$schema" = "$LINUX_STATE_SCHEMA" ] || { echo "::error::The macOS app keeps state of schema $schema, and the Linux app of $LINUX_STATE_SCHEMA"; exit 1; }
          echo "schema=$schema" >>"$GITHUB_OUTPUT"

  # macOS's publish, as Linux's and Windows's, in the same Environment and with the same steps, under macOS's names
  # (release/publish.sh, target_files): the tarball and the disk image the Developer ID signed, by the signing job's words
  # for them, and of the schema the macOS describe read. Linux's publish never waits for it.
  desktop-mac-publish:
    needs:
      - desktop-mac-sign
      - desktop-mac-describe
      - desktop-signing-mode
    if: needs.desktop-signing-mode.outputs.mac-signing == 'developer-id'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The disk image is sent and read back.
    timeout-minutes: 30
    environment: desktop-release
    permissions:
      contents: read
    # One macOS release at a time, so its latest.json names the newest of tags pushed close together.
    concurrency:
      group: desktop-release-darwin-arm64
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-mac-tarball
          path: out/desktop

      - name: Take the disk image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-mac-dmg
          path: out/desktop

      - name: Sign its manifest
        env:
          DESKTOP_TARGET: darwin-arm64
          DESKTOP_RELEASE_KEY: ${{ secrets.DESKTOP_RELEASE_KEY }}
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-mac-sign.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-mac-sign.outputs.size }}
          DESKTOP_STATE_SCHEMA: ${{ needs.desktop-mac-describe.outputs.schema }}
        run: desktop/release/publish.sh sign "${GITHUB_REF_NAME#v}" out/desktop

      - name: Publish the release
        env:
          DESKTOP_TARGET: darwin-arm64
          DESKTOP_DMG_SHA256: ${{ needs.desktop-mac-sign.outputs.dmg-sha256 }}
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: desktop/release/publish.sh send "${GITHUB_REF_NAME#v}" out/desktop

  # macOS's part of the release while desktop-signing-mode says no Developer ID signs: Surogate.app built and laid out
  # as desktop-mac-build lays it out, with a stand-in for arm64's guest image's manifest, as no arm64 image is built
  # then; checked; signed with an identity of this job's run, self-signed in a keychain of this job's own, and checked as
  # the release checks its own; packed, and put in a disk image that is checked too. Nothing of it is notarized or
  # published, and no job waits for it, nor for its describe: a trial that fails, or a Mac runner that never comes,
  # holds nothing of the release. It holds no secret, no Environment and no token to sign with: its identity is made and
  # forgotten here. Its tarball is kept for its describe alone.
  desktop-mac-trial:
    needs:
      - desktop-build
      - desktop-signing-mode
    if: needs.desktop-signing-mode.outputs.mac-signing == 'trial'
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.made.outputs.sha256 }}
      size: ${{ steps.made.outputs.size }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          # The app's node, its rg and its spelling dictionary are fetched and checked against their pins, never ones a runner kept.
          rm -rf bin dictionaries
          npm ci

      - name: Build the app for a Mac, with every native program of it
        run: scripts/mac-build.sh

      - name: Take the agent disk
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-agent-disk
          path: out/agent

      - name: Lay out Surogate.app
        run: |
          mkdir -p ../out/vm
          printf '{"key":"%s","arch":"arm64","files":[]}\n' "$(printf '0%.0s' $(seq 64))" > ../out/vm/manifest.json
          scripts/package-mac.sh "${GITHUB_REF_NAME#v}" ../out/vm/manifest.json ../out/agent/agent.img ../out/mac

      - name: Check the layout
        env:
          SUROGATE_MAC_LAYOUT: ${{ github.workspace }}/out/mac/Surogate.app
          SUROGATE_MAC_AGENT_DISK: ${{ github.workspace }}/out/agent/agent.img
          SUROGATE_MAC_VM_MANIFEST: ${{ github.workspace }}/out/vm/manifest.json
        run: SUROGATE_MAC_VERSION="${GITHUB_REF_NAME#v}" npx vitest run --project unit --reporter=verbose test/package-mac.test.ts

      - name: Sign the app with this run's identity, check it as the release checks its own, pack it, and make its disk image
        id: trial
        env:
          SIGNER: ${{ needs.desktop-signing-mode.outputs.mac-signer }}
        run: |
          keychain="$RUNNER_TEMP/trial.keychain-db"
          echo "keychain=$keychain" >>"$GITHUB_OUTPUT"
          identity="$(scripts/sign-mac.sh trial "$keychain" "$SIGNER")"
          scripts/sign-mac.sh sign ../out/mac/Surogate.app "$identity" "$keychain"
          scripts/sign-mac.sh verify ../out/mac/Surogate.app trial "$SIGNER"
          mkdir ../out/release
          scripts/sign-mac.sh pack ../out/mac/Surogate.app "../out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz"
          scripts/sign-mac.sh dmg ../out/mac/Surogate.app "../out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg" "$identity" "$keychain"
          scripts/sign-mac.sh dmg-check "../out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.dmg" ../out/mac/Surogate.app trial "$SIGNER"

      - name: Forget the keychain
        if: always() && steps.trial.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.trial.outputs.keychain }}
        run: scripts/sign-mac.sh forget "$KEYCHAIN"

      - name: Say the tarball's hash and size to its describe
        id: made
        run: |
          echo "sha256=$(shasum -a 256 <"../out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "size=$(stat -f %z "../out/release/surogate-desktop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz")" >>"$GITHUB_OUTPUT"

      - name: Keep the tarball for its describe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mac-trial-tarball
          path: out/release/surogate-desktop-*-darwin-arm64.tar.gz
          if-no-files-found: error

  # The trial's tarball read as macOS's describe reads the release's, in a job with no secret, which no job waits for.
  desktop-mac-trial-describe:
    needs:
      - desktop-describe
      - desktop-mac-trial
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-mac-trial-tarball
          path: out/mac

      - name: Write its manifest, and check the app's state schema against the Linux app's
        env:
          DESKTOP_TARGET: darwin-arm64
          DESKTOP_TARBALL_SHA256: ${{ needs.desktop-mac-trial.outputs.sha256 }}
          DESKTOP_TARBALL_SIZE: ${{ needs.desktop-mac-trial.outputs.size }}
          LINUX_STATE_SCHEMA: ${{ needs.desktop-describe.outputs.schema }}
        run: |
          desktop/release/publish.sh describe "${GITHUB_REF_NAME#v}" out/mac
          schema="$(jq -r .stateSchema out/mac/manifest.json)"
          [ "$schema" = "$LINUX_STATE_SCHEMA" ] || { echo "::error::The macOS app keeps state of schema $schema, and the Linux app of $LINUX_STATE_SCHEMA"; exit 1; }

  # Whether the macOS app is this release's, for the cluster's rollout: published, where desktop-signing-mode says the
  # Developer ID signs, with arm64's guest image's manifest attached to the release; or not asked for, in a trial. One
  # job for the platform, which each rollout waits for, so that a platform added is a job more and not twice the
  # rollouts: in a trial every job of macOS's publishing is skipped as soon as its needs have ended, which are Linux's
  # and the cloud's, and this runs then; the trial's own jobs it never waits for.
  desktop-mac-released:
    needs:
      - desktop-signing-mode
      - desktop-mac-publish
      - desktop-vm-manifest-arm64
    if: ${{ !cancelled() && (needs.desktop-signing-mode.outputs.mac-signing == 'trial' || (needs.desktop-mac-publish.result == 'success' && needs.desktop-vm-manifest-arm64.result == 'success')) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say whether the release publishes the macOS app
        env:
          SIGNING: ${{ needs.desktop-signing-mode.outputs.mac-signing }}
        run: if [ "$SIGNING" = developer-id ]; then echo "The macOS app is published"; else echo "The macOS app is a trial, and the release publishes none"; fi

  release:
    needs:
      - wheel
      - images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags so release-notes.mjs can diff against the
          # previous tag and read every commit subject in the range.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Generate release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/release-notes.mjs > release-notes.md

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # The wheel and the sdist alone: never another file the build left in dist/.
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md

  # The cluster's rollout (update-images.yml): the nodes update their agent images and the agent
  # pods restart. It runs only once every other job of the release has succeeded: the cloud's release
  # (the images, the npm packages and the wheel), and the desktop's, from its VM image to its
  # publish and the image's manifest attached. Its needs reach each job, and a job that failed,
  # was skipped or was cancelled keeps the cluster as it is: each of its two jobs runs only where all
  # its needs succeeded (success(), which an if with no status check of its own adds), and only one
  # of the two runs, by desktop-signing-mode's word for the run. While Windows publishes nothing (a
  # trial), the Windows jobs are none of the release's: rollout needs none of them, and runs once
  # Linux's desktop is published, whatever Windows's trial does. Where the account signs, Windows's
  # publish is the release's too, and rollout-with-windows waits for it as for Linux's. Each waits for
  # macOS through desktop-mac-released alone: macOS's publish where the Developer ID signs, and none of
  # macOS's trial.
  rollout:
    needs:
      - release
      - npm
      - desktop-publish
      - desktop-vm-manifest
      - desktop-signing-mode
      - desktop-mac-released
    if: needs.desktop-signing-mode.outputs.signing == 'trial'
    # It holds the cluster's SSH key and reads nothing of the repository's.
    permissions: {}
    uses: ./.github/workflows/update-images.yml
    secrets:
      NODE_HOSTS: ${{ secrets.NODE_HOSTS }}
      MASTER_HOST: ${{ secrets.MASTER_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}

  rollout-with-windows:
    needs:
      - release
      - npm
      - desktop-publish
      - desktop-vm-manifest
      - desktop-win-publish
      - desktop-signing-mode
      - desktop-mac-released
    if: needs.desktop-signing-mode.outputs.signing == 'account'
    permissions: {}
    uses: ./.github/workflows/update-images.yml
    secrets:
      NODE_HOSTS: ${{ secrets.NODE_HOSTS }}
      MASTER_HOST: ${{ secrets.MASTER_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
