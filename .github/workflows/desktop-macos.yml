# The desktop's suites on a Mac: GitHub's macos-15 runners, Apple silicon. Started by hand, once, on a
# branch's final head: GitHub bills a macOS runner's minutes at a multiple of Linux's, and every suite
# runs once a branch. A run tests whatever code the ref names, so no job here is given anything to
# leak: no secret, no Environment, and a token that reads the repository alone.
name: Desktop on macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit whose desktop to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The files of desktop/vitest.config.ts's macos project: those that pass on macOS, which each part of
  # the app built for macOS joins.
  unit:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # npm ci leaves no Electron binary.
      - name: Install Electron
        run: npm run electron:install

      # The app's code, which a file of the project runs as the app does; the app's own way of starting a program
      # cleanly on macOS, beside its node; and surogate-helper, which reads this Mac's Computer Name, its processes and
      # its admin trust domain for the project's files that look at them on a Mac.
      - name: Build the app's code, surogate-spawn and surogate-helper
        run: |
          npx tsc -p tsconfig.build.json
          native/spawn/build.sh
          native/helper/build.sh

      - name: Run the suites that pass on macOS
        run: npx vitest run --project macos

  # The file host's suites, with the helper in srt's real Seatbelt: the file host's calls, the walk, the landing, the
  # hook guard and the race of a process of this computer's. A job of their own, each suite a step of its own with a
  # bound of its own, so that one that hangs leaves the others' results, and the log, to read.
  file-host:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # What the file host runs on: the app's code, fsat beside it, surogate-spawn, a node at bin/node as the app's
      # own (this runner's, until the release pins macOS's), and the app's rg beside it, on the PATH as the app's
      # tools are.
      - name: Build the file host
        run: |
          npx tsc -p tsconfig.build.json
          native/fsat/build.sh
          native/spawn/build.sh
          mkdir -p bin
          cp "$(command -v node)" bin/node
          scripts/rg.sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: The file host's calls, its lock, and srt's Seatbelt
        timeout-minutes: 10
        run: >-
          npx vitest run --project unit --reporter=verbose test/clean-child.test.ts test/fd-paths-darwin.test.ts
          test/srt-darwin.test.ts test/folder-lock.test.ts test/boot-id.test.ts test/hosts-handed.test.ts
          test/policy-darwin.test.ts test/flags.test.ts

      - name: The walk and the hook guard
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx vitest run --project unit --reporter=verbose test/operations.test.ts test/hooks.test.ts test/hooks-chmod.test.ts

      - name: The landing
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx vitest run --project unit --reporter=verbose test/land.test.ts

      - name: The race
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx vitest run --project unit --reporter=verbose test/file-tools-race.test.ts

  # surogate-vm (desktop/native/macos): its Swift tests, which make the Virtualization framework's
  # configuration and never start it, since the runner, a VM itself, has no nested virtualization; then
  # the program built for Apple silicon and signed ad hoc with its one entitlement, and its own answer
  # to whether this Mac can run the guest, which the run records.
  vm-native:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the toolchain
        run: xcodebuild -version && swift --version

      - name: Run surogate-vm's tests
        run: swift test --package-path native/macos

      - name: Build surogate-vm and sign it ad hoc
        run: native/build.sh

      - name: Check its signature and its one entitlement
        run: |
          codesign --verify --strict --verbose=2 native/out/surogate-vm
          codesign -d --entitlements - --xml native/out/surogate-vm > entitlements.plist
          grep -q "com.apple.security.virtualization" entitlements.plist
          [ "$(grep -o '<key>[^<]*</key>' entitlements.plist | sort -u)" = "<key>com.apple.security.virtualization</key>" ]

      - name: Ask it whether this Mac can run the guest
        run: |
          native/out/surogate-vm version
          native/out/surogate-vm check | tee check.json
          grep -q '"supported"' check.json

  # The shell and the browser on a Mac: surogate-helper and surogate-spawn built, the helper with its own tests; the
  # shell's and the browser's files of the macos project with the helper there to run; the app end to end, with no
  # VM; and the browser host headed on the runner's own Chrome and Edge. Each step runs whatever came of the one
  # before it. A change to the admin trust domain waits for an administrator to confirm it, which nobody can on a
  # runner, and the runner's authorization database refuses to let it go unasked (errAuthorizationDenied):
  # test/darwin/admin-trust.sh runs by hand on a Mac.
  shell:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # npm ci leaves no Electron binary; its fuses flipped, it is signed ad hoc again.
      - name: Install Electron
        run: npm run electron:install

      # The app's own programs with it: surogate-helper, and surogate-spawn, through which the app starts every program;
      # and the app's rg, where the app looks for the file helper's tools.
      - name: Build the app for a Mac, surogate-helper and surogate-spawn with it, and fetch its rg
        run: |
          npm run build:darwin
          scripts/rg.sh

      - name: Run surogate-helper's own tests
        if: ${{ !cancelled() }}
        working-directory: desktop/native/helper
        run: swift test

      - name: Run the shell's and the browser's files of the macos project
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run --project macos
          test/shell-places-darwin.test.ts test/computer-name-darwin.test.ts test/backups-darwin.test.ts test/folders-held-darwin.test.ts
          test/mac-helper.test.ts test/login-item-darwin.test.ts test/deep-link-darwin.test.ts test/credentials-darwin.test.ts
          test/menus-darwin.test.ts test/main-window-darwin.test.ts test/quick-entry-darwin.test.ts test/ca-source-darwin.test.ts
          test/browser-known-darwin.test.ts test/browser-processes-darwin.test.ts

      - name: Run the app end to end on a Mac
        if: ${{ !cancelled() }}
        run: npx vitest run -c vitest.e2e.config.ts test/e2e/macos.e2e.ts

      - name: Run the browser host on the runner's Chrome
        if: ${{ !cancelled() }}
        env:
          SUROGATE_BROWSER_TESTS_MAC: "1"
          SUROGATE_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: npx vitest run --project macos test/browser-host-darwin.test.ts

      - name: Run the browser host on the runner's Edge
        if: ${{ !cancelled() }}
        env:
          SUROGATE_BROWSER_TESTS_MAC: "1"
          SUROGATE_TEST_BROWSER: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
        run: npx vitest run --project macos test/browser-host-darwin.test.ts

  # Surogate.app as the release makes it: built with every native program, laid out (scripts/package-mac.sh) with a disk
  # of zeros in the agent disk's place and a manifest of the arm64 image's form, and checked; scripts/sign-mac.sh's own
  # tests; then the app signed with an identity of this run's own, self-signed in a keychain of the job's, and checked as
  # the release checks its own, packed as the update payload, and put in a disk image that is checked too. The signed
  # node runs under the hardened runtime with its one entitlement, V8's compilers and the file host's suites on it, with
  # the signed fsat. Notarization and Gatekeeper's assessment are the release's alone: they take only Apple's Developer
  # ID. The keychain is gone at the job's end, however it ends.
  app:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      - name: Build the app for a Mac, with every native program of it
        run: scripts/mac-build.sh

      - name: Lay out Surogate.app
        run: |
          mkdir -p ../out/stand-in
          head -c 16777216 /dev/zero > ../out/stand-in/agent.img
          printf '{"key":"%s","arch":"arm64","files":[]}\n' "$(printf '0%.0s' $(seq 64))" > ../out/stand-in/manifest.json
          scripts/package-mac.sh 0.1.0 ../out/stand-in/manifest.json ../out/stand-in/agent.img ../out/mac

      - name: Check the layout
        env:
          SUROGATE_MAC_LAYOUT: ${{ github.workspace }}/out/mac/Surogate.app
          SUROGATE_MAC_VERSION: "0.1.0"
          SUROGATE_MAC_AGENT_DISK: ${{ github.workspace }}/out/stand-in/agent.img
          SUROGATE_MAC_VM_MANIFEST: ${{ github.workspace }}/out/stand-in/manifest.json
        run: npx vitest run --project unit --reporter=verbose test/package-mac.test.ts

      - name: Run sign-mac.sh's own tests
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: test/sign-mac.test.sh

      # Handed on as the release hands it from its build to its signing, packed and unpacked elsewhere.
      - name: Sign the app with this run's identity, check it as the release checks its own, pack it, and make its disk image
        id: trial
        run: |
          scripts/sign-mac.sh pack ../out/mac/Surogate.app ../out/desktop-mac-unsigned.tar.gz
          mkdir ../out/signed
          tar -xzf ../out/desktop-mac-unsigned.tar.gz -C ../out/signed
          keychain="$RUNNER_TEMP/trial.keychain-db"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          identity="$(scripts/sign-mac.sh trial "$keychain" 'Surogate trial signer')"
          scripts/sign-mac.sh sign ../out/signed/Surogate.app "$identity" "$keychain"
          scripts/sign-mac.sh verify ../out/signed/Surogate.app trial 'Surogate trial signer'
          scripts/sign-mac.sh pack ../out/signed/Surogate.app ../out/signed/surogate-desktop-0.1.0-darwin-arm64.tar.gz
          scripts/sign-mac.sh dmg ../out/signed/Surogate.app ../out/signed/surogate-desktop-0.1.0-darwin-arm64.dmg "$identity" "$keychain"
          scripts/sign-mac.sh dmg-check ../out/signed/surogate-desktop-0.1.0-darwin-arm64.dmg ../out/signed/Surogate.app trial 'Surogate trial signer'

      # V8 under the hardened runtime with allow-jit alone: its compilers and WebAssembly's, in the signed node.
      - name: Run the signed node under the hardened runtime
        run: |
          node=../out/signed/Surogate.app/Contents/Resources/app/bin/node
          codesign -dvvv "$node" 2>&1 | grep -E '^(CodeDirectory|Authority|Timestamp)'
          "$node" -e 'let sum = 0; const add = (a, b) => a + b; for (let i = 0; i < 5e7; i += 1) sum = add(sum, i & 7); const wasm = new WebAssembly.Module(Uint8Array.from([0, 97, 115, 109, 1, 0, 0, 0, 1, 7, 1, 96, 2, 127, 127, 1, 127, 3, 2, 1, 0, 7, 7, 1, 3, 97, 100, 100, 0, 0, 10, 9, 1, 7, 0, 32, 0, 32, 1, 106, 11])); const { exports } = new WebAssembly.Instance(wasm); if (sum !== 175000000 || exports.add(2, 3) !== 5) process.exit(1); console.log("V8 ran its compilers and WebAssembly under the hardened runtime")'

      # The bundle's signed node and fsat where a development build's file host takes them, each renamed over the one
      # there: macOS kills a signed program written over in place. Library validation then holds the two to one signer.
      - name: Run the file host's suites on the signed node and fsat
        timeout-minutes: 20
        run: |
          cp ../out/signed/Surogate.app/Contents/Resources/app/bin/node bin/node.new
          mv -f bin/node.new bin/node
          cp ../out/signed/Surogate.app/Contents/Resources/app/dist/native/fsat.node dist/native/fsat.node.new
          mv -f dist/native/fsat.node.new dist/native/fsat.node
          codesign -dvvv bin/node dist/native/fsat.node 2>&1 | grep -E '^(Executable|CodeDirectory|Authority)'
          PATH="$PWD/bin:$PATH" npx vitest run --project unit --reporter=verbose test/srt-darwin.test.ts test/operations.test.ts test/hooks.test.ts test/hooks-chmod.test.ts test/land.test.ts test/file-tools-race.test.ts

      - name: Forget this run's keychain
        if: always()
        env:
          KEYCHAIN: ${{ steps.trial.outputs.keychain }}
        run: if [ -n "$KEYCHAIN" ]; then scripts/sign-mac.sh forget "$KEYCHAIN"; fi
