# The desktop's suites on Windows: GitHub's windows-2025 runners, x64. Started by hand, once, on a
# branch's final head, or called by the release on the tag it releases: every suite runs once a
# branch. A run tests whatever code the ref names, so no job here is given anything to leak: no
# secret, no Environment, no token to sign with, and a token that reads the repository alone.
name: Desktop on Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit whose desktop to test
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: The tag or commit whose desktop to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The files of desktop/vitest.config.ts's windows project: those that pass on Windows, which each
  # part of the app built for Windows joins.
  unit:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      # The repository's files as they are written: git for Windows would check each text file out
      # with CRLF line ends, which no test reads as the app's own.
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      # No user's npmrc: npm reads none from a file that is not there.
      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # npm ci leaves no Electron binary. The script is a POSIX shell's, which npm runs in cmd on
      # Windows unless told otherwise: Git for Windows' bash, by its whole path, as no other bash on
      # the runner's PATH is.
      - name: Install Electron
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run electron:install

      - name: Check the desktop's types
        run: npm run typecheck

      - name: Run the suites that pass on Windows
        run: npx vitest run --project windows

  # The file host on Windows, where no srt contains its helper and its walk does (desktop/native/ntat): what the
  # runner's file system does recorded first, in the job's summary; then the app built for Windows, ntat with Visual
  # Studio's C++ tools, the app's rg and its native programs among it; then the walk's, the file kinds' and the lock's
  # suites on the runner's own NTFS, the race of a process of this computer's against the helper, and the app's own
  # path to the file host: its clean spawns, a chat's folder bound and looked at, and the host itself. Each suite a step
  # of its own with a bound of its own, so that one that hangs leaves the others' results, and the log, to read.
  file-host:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      - name: Record what the runner's file system does
        run: powershell -NoProfile -File test/win32/ntfs-facts.ps1 | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Build the app for Windows, with every native part of it
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run build:win32

      # As a PC's system volume does by default: the walk's refusal of a short name is tested on one NTFS made.
      - name: Let the runner's volumes make short names
        run: fsutil 8dot3name set 0

      - name: The walk, and the folder lock
        timeout-minutes: 10
        run: npx vitest run --project unit --reporter=verbose test/ntat-win32.test.ts test/folder-lock-win32.test.ts test/fs-through-walk.test.ts

      - name: The file kinds and the helper
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx vitest run --project unit --reporter=verbose test/file-host-win32.test.ts

      - name: The race
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npx vitest run --project unit --reporter=verbose test/file-tools-race-win32.test.ts

      - name: The app's own path to the file host
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npx vitest run --project unit --reporter=verbose test/clean-child-win32.test.ts test/binding-win32.test.ts test/host-win32.test.ts

  # What a Windows runner offers the VM, recorded and never gating: GitHub calls nested
  # virtualization on its runners experimental. Whether Virtual Machine Platform is on, and what the
  # Host Compute Service says of itself (desktop/test/vm/win32/hcs-probe).
  vm-probe:
    runs-on: windows-2025
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Keep the repository's line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Ask whether Virtual Machine Platform is on
        run: |
          $feature = Get-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform | Format-List FeatureName, State, RestartNeeded | Out-String
          $feature
          "### Virtual Machine Platform`n``````n$feature``````" >> $env:GITHUB_STEP_SUMMARY

      - name: Ask the Host Compute Service what it supports
        working-directory: desktop/test/vm/win32/hcs-probe
        run: |
          cargo build --release --locked
          $said = & .\target\release\hcs-probe.exe | Out-String
          $code = $LASTEXITCODE
          $said
          "### HcsGetServiceProperties, exit $code`n``````n$said``````" >> $env:GITHUB_STEP_SUMMARY
          exit $code

  # The Windows native programs: the HCS document and the service's protocol, checked and tested. It builds on
  # windows-2025 with its Visual Studio Build Tools and the toolchain the repository pins (rust-toolchain.toml), with
  # no secret. It gates: these are the service's parsing and the document that crosses into the guest.
  vm-native:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/native/windows
    steps:
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the native programs with clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test the native programs
        run: cargo test --locked --workspace

  # The TypeScript VM backend against a stand-in for surogate-vm.exe (test/vm/win32/fake-vm.mjs). It builds the
  # desktop's code first, which the stand-in imports; no secret. It gates: this is win32.ts's driver of the VM.
  vm-backend:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # The app's code alone, which the stand-in imports: npm run build is the Linux app's build, and refuses here.
      - name: Build the app's code
        run: npx tsc -p tsconfig.build.json

      - name: Run the VM backend against the stand-in
        run: npx vitest run test/vm-win32.test.ts

  # What vm-boot boots, which nothing builds on Windows: the x64 guest's image (images/guest/), from the guest stage of
  # images/sandbox/Dockerfile, unpacked as the measurements boot it, and the agent disk, made with e2fsprogs under
  # fakeroot, each as the release builds it, on a Linux runner; and the measurements' agent disk beside them. Kept a
  # day, for this run's boot alone, and published nowhere. It gates nothing, as the boot does not.
  vm-guest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A cold build of the guest. This bounds the job once a runner has taken it, and not before.
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        working-directory: desktop
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      - name: Build the desktop
        working-directory: desktop
        run: npm run build

      # The agent's disk holds root's files, and is made by a user who is not root, under fakeroot:
      # in no user namespace, which a stock Ubuntu 24.04 refuses a program without a profile of its own.
      - name: Install fakeroot, which the agent's disk is made with
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fakeroot

      - name: Make the agent disk
        working-directory: desktop
        run: npm run agent-disk

      # The guest stage adds LibreOffice, the Python data stack and Node, and the disk is made inside
      # the build: reclaim the toolchains the runner never uses. Not the tool cache, which holds this
      # job's Node.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # Unpacked beside the downloads, as the measurements boot it.
      - name: Build the image
        run: images/guest/build.sh --arch amd64 images/guest/out

      - name: Keep the image for the boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-guest-amd64
          path: |
            images/guest/out/initrd
            images/guest/out/rootfs.img
            images/guest/out/vmlinuz
            images/guest/out/manifest.json
          retention-days: 1
          if-no-files-found: error

      - name: Keep the agent disk for the boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-agent-disk
          path: desktop/dist/agent.img
          retention-days: 1
          if-no-files-found: error

      # The measurements' agent disk, whose init also runs, as the guest's root, a probe a measurement leaves in a
      # shared folder, and writes the kernel's own log to the console once the agent has said hello, each line with its
      # time since the kernel's start (test/vm/win32/measure/probe.sh, put in as macOS's prepare.sh puts its own). Never
      # the app's, so made out of dist/; last, so the boot has its image and its agent disk whatever becomes of this one.
      - name: Make the measurements' agent disk
        continue-on-error: true
        working-directory: desktop
        run: |
          tree=$(mktemp -d) && mkdir "$tree/vm" && ln -s "$PWD/dist" "$tree/dist"
          ln -s "$PWD/vm/agent-disk.sh" "$PWD/vm/enter-root" "$tree/vm/"
          awk 'FNR == NR { probe = probe $0 "\n"; next } /^exec \/usr\/bin\/tini/ { printf "%s", probe } { print }' test/vm/win32/measure/probe.sh vm/init > "$tree/vm/init"
          chmod 755 "$tree/vm/init" && grep -q measure-probe "$tree/vm/init"
          mkdir -p test/vm/win32/measure/probing
          "$tree/vm/agent-disk.sh" test/vm/win32/measure/probing/agent.img

      - name: Keep the measurements' agent disk for the boot
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-agent-measure-disk
          path: desktop/test/vm/win32/measure/probing/agent.img
          retention-days: 1
          if-no-files-found: error

  # One real boot through the development service, experimental and never gating: GitHub does not promise nested
  # virtualization on its runners. It builds the native programs and the desktop, installs the development service,
  # takes vm-guest's image and agent disks, gives the agent disk its VHD footer, and runs the boot and requirements
  # measurements. If the guest boots, their JSON holds the timings; if it does not, it holds the Host Compute Service's
  # own words. Either way the result is kept with each boot's console and Hyper-V's own events, and the job does not
  # fail the branch.
  vm-boot:
    needs: vm-guest
    runs-on: windows-2025
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Build the native programs
        working-directory: desktop/native/windows
        run: cargo build --locked --release

      - name: Install the desktop's packages
        working-directory: desktop
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      # The app's code alone, which gives the agent disk its footer below: npm run build is the Linux app's build, and
      # refuses here.
      - name: Build the app's code
        working-directory: desktop
        run: npx tsc -p tsconfig.build.json

      - name: Take the guest image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-guest-amd64
          path: images/guest/out

      - name: Take the agent disk
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-agent-disk
          path: desktop/dist

      # Where there is none, the boot with the kernel's log says the agent disk is missing, and the rest boot on.
      - name: Take the measurements' agent disk
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-agent-measure-disk
          path: desktop/test/vm/win32/measure/probing

      # Hyper-V opens a disk only as a VHD: the raw agent disk the release makes, made a fixed one in place by the
      # app's own code (scripts/vhd-footer.mjs), as the app's Windows layout makes it.
      - name: Give the agent disk its VHD footer
        working-directory: desktop
        run: node scripts/vhd-footer.mjs dist/agent.img

      - name: Install the development VM service
        working-directory: desktop/native/windows
        run: powershell -ExecutionPolicy Bypass -File dev-service.ps1

      # The agent disk with its footer. The measurements give the image's disk its own, as the app's delivery does, and
      # the measurements' agent disk too.
      - name: Try one real boot, and record what happened
        working-directory: desktop
        continue-on-error: true
        env:
          SUROGATE_VM_AGENT_DISK: ${{ github.workspace }}\desktop\dist\agent.img
          SUROGATE_VM_PROBING_DISK: ${{ github.workspace }}\desktop\test\vm\win32\measure\probing\agent.img
        run: |
          $said = npx vitest run -c test/vm/win32/measure/vitest.config.ts requirements boot 2>&1 | Out-String
          $said
          "### A real boot on a GitHub runner`n``````n$said``````" >> $env:GITHUB_STEP_SUMMARY

      # Each boot's console as the guest printed it, kept beside the findings; and what Hyper-V's own logs said of the
      # VMs while the job ran (its 40 minutes, and a margin), each event at its UTC time, to set beside each boot's
      # "asked at".
      - name: Say each boot's console, and Hyper-V's own events
        if: always()
        working-directory: desktop
        run: |
          $kept = "test/vm/win32/measure/out/consoles"
          New-Item -ItemType Directory -Force $kept | Out-Null
          $consoles = foreach ($log in Get-ChildItem "$env:TEMP\surogate-measure\*\logs\vm-console.log" -ErrorAction SilentlyContinue) {
            $name = $log.Directory.Parent.Name
            Copy-Item $log.FullName "$kept\$name.log"
            "--- $name, $($log.Length) bytes, last written $($log.LastWriteTimeUtc.ToString('o'))"
            Get-Content -Raw $log.FullName
          }
          $consoles = $consoles | Out-String
          $consoles
          "### Each boot's console`n``````n$consoles``````" >> $env:GITHUB_STEP_SUMMARY
          $since = (Get-Date).AddMinutes(-45)
          $logs = Get-WinEvent -ListLog 'Microsoft-Windows-Hyper-V*' -ErrorAction SilentlyContinue | Where-Object { $_.RecordCount -gt 0 } | ForEach-Object LogName
          $events = foreach ($log in $logs) { Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = $since } -ErrorAction SilentlyContinue }
          # The worker's performance summaries (3086) carry what their message leaves out, in their properties.
          $events = $events | Sort-Object TimeCreated | ForEach-Object {
            $more = if ($_.Id -eq 3086) { " | " + (($_.Properties | ForEach-Object { "$($_.Value)" }) -join '; ') -replace '\s+', ' ' } else { "" }
            "{0} {1} {2} {3}: {4}{5}" -f $_.TimeCreated.ToUniversalTime().ToString('HH:mm:ss.fff'), $_.LogName.Replace('Microsoft-Windows-', ''), $_.Id, $_.LevelDisplayName, ($_.Message -replace '\s+', ' '), $more
          } | Out-String
          $events
          "### Hyper-V's own events, UTC`n``````n$events``````" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep what the boot found
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-win-vm-boot
          path: desktop/test/vm/win32/measure/out
          if-no-files-found: ignore
          retention-days: 7

  # The shell and the browser on Windows: surogate-helper.exe's own lints and tests, those that fill the runner's
  # certificate stores among them; the app end to end with no VM; and the browser host on the runner's own Chrome and
  # Edge, headed.
  shell:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Keep the repository's line ends
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      - name: Install Electron
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run electron:install

      # The runner's own browsers, which the browser host's tests drive: each must be there, and its version is recorded.
      - name: Find the runner's Chrome and Edge
        run: |
          $found = foreach ($browser in "C:\Program Files\Google\Chrome\Application\chrome.exe", "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe") {
            if (-not (Test-Path $browser)) { throw "No browser at $browser" }
            "$browser $((Get-Item $browser).VersionInfo.ProductVersion)"
          }
          $found
          "### The runner's browsers`n``````n$($found -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY

      # A member of the native workspace (native/windows): its toolchain, as the workspace's rust-toolchain.toml pins
      # it, and its crates as the workspace's Cargo.lock locks them.
      - name: Lint surogate-helper.exe
        working-directory: desktop/native/windows/helper
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run surogate-helper.exe's own tests, those that add roots to the runner's stores among them
        if: ${{ !cancelled() }}
        working-directory: desktop/native/windows/helper
        run: cargo test --locked -- --include-ignored

      - name: Build the app for Windows, with every native part of it
        if: ${{ !cancelled() }}
        env:
          NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
        run: npm run build:win32

      - name: Run the app end to end on Windows
        if: ${{ !cancelled() }}
        run: npx vitest run -c vitest.e2e.config.ts test/e2e/windows.e2e.ts

      - name: Run the browser host on the runner's Chrome
        if: ${{ !cancelled() }}
        env:
          SUROGATE_BROWSER_TESTS_WIN: "1"
          SUROGATE_TEST_BROWSER: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: npx vitest run --project windows test/browser-host-win32.test.ts

      - name: Run the browser host on the runner's Edge
        if: ${{ !cancelled() }}
        env:
          SUROGATE_BROWSER_TESTS_WIN: "1"
          SUROGATE_TEST_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: npx vitest run --project windows test/browser-host-win32.test.ts
