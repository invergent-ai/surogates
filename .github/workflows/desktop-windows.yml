# The desktop's suites on Windows: GitHub's windows-2025 runners, x64. Started by hand, once, on a
# branch's final head: every suite runs once a branch. A run tests whatever code the ref names, so no
# job here is given anything to leak: no secret, no Environment, and a token that reads the repository
# alone.
name: Desktop on Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit whose desktop to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The desktop's types, checked on Windows: the first of its suites there, which each part of the app
  # built for Windows adds to.
  unit:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      # No user's npmrc: npm reads none from a file that is not there.
      - name: Install the desktop's packages
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: npm ci

      - name: Check the desktop's types
        run: npm run typecheck
